services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=darts-test
    ports:
      - '5432:5432'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d darts-test
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
    name: darts-db-test
